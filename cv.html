    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
    <script>
        // Ensure pdfjsLib is defined
        const pdfjsLib = window['pdfjs-dist/build/pdf'];

        // Specify the workerSrc (required for pdf.js to work properly)
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        window.onload = async function () {
            // Path to your PDF file
            var filePath = '/content/cv/Anway Pimpalkar - CV.pdf';

            try {
                // Load the PDF file
                const pdf = await pdfjsLib.getDocument(filePath).promise;
                const metadata = await pdf.getMetadata();
                const creationDate = metadata.info.CreationDate || 'Not Available';
                displayCreationDate(formatCreationDate(creationDate));
            } catch (error) {
                console.error('Error loading PDF:', error);
                displayCreationDate('Error fetching creation date');
            }
        };

        function formatCreationDate(dateString) {
            if (!dateString || dateString === 'Not Available') return 'N/A';

            // Parse the PDF date format (D:YYYYMMDDHHmmSS)
            const match = /D:(\d{4})(\d{2})(\d{2})?(\d{2})?(\d{2})?(\d{2})?/.exec(dateString);
            if (match) {
                const year = match[1];
                const month = match[2] - 1;
                const day = match[3] || '01';
                const dateObj = new Date(year, month, day);
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return dateObj.toLocaleDateString(undefined, options);
            }

            return 'N/A'; // Return 'N/A' if parsing fails
        }


        function displayCreationDate(date) {
            const creationDateElement = document.getElementById('creationDate');
            creationDateElement.textContent = date;
        }
    </script>

    <script>
        async function renderPDF(url, containerId) {
            const loadingTask = pdfjsLib.getDocument(url);
            const pdf = await loadingTask.promise;
            const container = document.getElementById(containerId);

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas';
                container.appendChild(canvas);

                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                await page.render(renderContext).promise;
            }
        }

        function formatCreationDate(dateString) {
            if (!dateString || dateString === 'Not Available') return 'N/A';

            const match = /D:(\d{4})(\d{2})(\d{2})?/.exec(dateString);
            if (match) {
                const year = match[1];
                const month = parseInt(match[2]) - 1;
                const day = match[3] || '01';
                const dateObj = new Date(year, month, day);
                return dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
            }

            return 'N/A';
        }

        function displayCreationDate(date) {
            document.getElementById('creationDate').textContent = date;
        }

        window.onload = async () => {
            const filePath = '/content/cv/Anway Pimpalkar - CV.pdf';
            try {
                const pdf = await pdfjsLib.getDocument(filePath).promise;
                const metadata = await pdf.getMetadata();
                const creationDate = metadata.info.CreationDate || 'Not Available';
                displayCreationDate(formatCreationDate(creationDate));
            } catch (err) {
                console.error('Metadata error:', err);
                displayCreationDate('Error loading');
            }

            await renderPDF(filePath, 'pdf-container');
        };
    </script>
