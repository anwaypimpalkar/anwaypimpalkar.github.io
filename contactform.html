<!-- Contact Form Overlay -->
<div id="contact-overlay">
    <div id="contact-form-wrapper">
        <div class="contact-header">
            <h2>Contact Me</h2>
            <button id="close-contact" aria-label="Close form"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p style="font-size: 16px; margin-bottom: 1em;">
            I'd love to hear from you! Feel free to reach out using the form below.
            Alternatively, you can email me directly at
            <span
                style="white-space: nowrap; color: #18354f;">anwaypimpalkar&nbsp;&#91;at&#93;&nbsp;gmail&nbsp;&#91;dot&#93;&nbsp;com</span>.
        </p>
        <form id="contact-form">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" rows="10" placeholder="Message" required></textarea>
            <div class="form-submit">
                <button type="submit">Send&NonBreakingSpace;<i class="fa-solid fa-paper-plane fa-md"></i></button>
            </div>
        </form>
    </div>
</div>
